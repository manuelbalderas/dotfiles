# ~/.config/tmux/tmux.conf (tmux >= 3.2 reads this path natively)

# --- General ---
set -g prefix C-b
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g mode-keys vi
set -g set-clipboard on        # OSC 52: lets nvim/tmux yank reach the system clipboard
set -g allow-passthrough on
set -g aggressive-resize on

# True color + italics + cursor shape (nvim)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,*:RGB"
set -as terminal-features ",xterm-ghostty:RGB:usstyle"

# --- Keys ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"
# vim-style: v = side by side (:vsplit), s = top/bottom (:split)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
# fuzzy session switcher (needs fzf); prefix w still opens the built-in tree
bind S display-popup -E -w 50% -h 40% -T " sessions " "tmux list-sessions | cut -d: -f1 | fzf --reverse --prompt='session> ' | xargs tmux switch-client -t"
bind c new-window -c "#{pane_current_path}"
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Seamless Ctrl+h/j/k/l between tmux panes and nvim splits (and fzf).
# Matching nvim keymaps are in nvim/init.lua ("nav"): they hop back out to tmux at the edge.
# prefix + Ctrl+l still sends a real Ctrl+l (clear screen) to the shell.
is_vim="#{m/r:^(n?vim|fzf),#{pane_current_command}}"
bind -n C-h if -F "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l

# Resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows: Alt+1..9 jump
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- Tokyo Night theme (mirrors nvim mini.statusline + tokyonight-night) ---
# bg #1a1b26  bg_dark #16161e  black #15161e  bg_hl #292e42  fg_gutter #3b4261
# fg #c0caf5  fg_dark #a9b1d6  comment #565f89
# blue #7aa2f7  cyan #7dcfff  green #9ece6a  magenta #bb9af7  yellow #e0af68  red #f7768e
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#16161e,fg=#a9b1d6"
set -g status-left-length 40
set -g status-right-length 80

# left = ModeNormal; right = Fileinfo (date/time) + ModeNormal (host)
set -g status-left "#[bg=#7aa2f7,fg=#15161e,bold]  #S #[bg=#16161e,fg=#a9b1d6] "
set -g status-right "#[bg=#3b4261,fg=#a9b1d6]  %a %d %b   %H:%M #[bg=#7aa2f7,fg=#15161e,bold] 󰒋 #h "

set -g window-status-separator ""
set -g window-status-format "#[bg=#1a1b26,fg=#c0caf5] #I #W "
set -g window-status-current-format "#[bg=#9ece6a,fg=#1a1b26,bold] #I #W#{?window_zoomed_flag, 󰁌,} "
set -g window-status-activity-style "fg=#e0af68"
set -g window-status-bell-style "fg=#f7768e"

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#7dcfff"
set -g message-command-style "bg=#292e42,fg=#e0af68"
set -g mode-style "bg=#33467c,fg=#c0caf5"
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#565f89"
set -g clock-mode-colour "#7aa2f7"
